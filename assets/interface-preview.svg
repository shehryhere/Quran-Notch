<text x="640" y="252" text-anchor="middle" font-size="48" direction="rtl" font-family="Geeza Pro,Noto Naskh Arabic,Amiri,serif" fill="#fff">فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ</text>
